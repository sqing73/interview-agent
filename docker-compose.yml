x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-interview_agent}
  POSTGRES_USER: ${POSTGRES_USER:-interview}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview_pass}

services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-agent-postgres
    restart: unless-stopped
    environment:
      <<: *postgres-env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: interview-agent-ai-service
    restart: unless-stopped
    network_mode: host # TODO: ollama on different server
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OTEL_SERVICE_NAME: interview-ai-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://localhost:4318/v1/traces
    volumes:
      - ./ai-service/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    develop:
      watch:
        - action: rebuild
          path: ./ai-service/requirements.txt

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: interview-agent-orchestrator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AI_SERVICE_BASE_URL: http://host.docker.internal:8000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: rebuild
          path: ./orchestrator/src
        - action: rebuild
          path: ./orchestrator/pom.xml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: interview-agent-frontend
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_started
    environment:
      VITE_BACKEND_PROXY_TARGET: http://orchestrator:8080
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    container_name: interview-agent-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: interview-agent-otel-collector
    restart: unless-stopped
    depends_on:
      - jaeger
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: interview-agent-prometheus
    restart: unless-stopped
    depends_on:
      - otel-collector
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  postgres_data:
