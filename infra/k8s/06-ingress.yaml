apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interview-agent-ingress
  namespace: interview-agent
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 8080
          - path: /v1/traces
            pathType: Prefix
            backend:
              service:
                name: otel-collector
                port:
                  number: 4318
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
