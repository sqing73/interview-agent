server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: interview-orchestrator
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview_agent}
    username: ${POSTGRES_USER:interview}
    password: ${POSTGRES_PASSWORD:interview_pass}

ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}

interview:
  stage-questions:
    intro: ${INTERVIEW_INTRO_QUESTIONS:1}
    technical: ${INTERVIEW_TECHNICAL_QUESTIONS:1}
    behavioral: ${INTERVIEW_BEHAVIORAL_QUESTIONS:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        interview.llm.ttft: true
        interview.llm.stream.duration: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
